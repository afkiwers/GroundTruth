  U2: {value: NCP718ASN330T1G, footprint: SOT-23-5, model: open}
  C6: {value: 100n0, footprint: C_0603_1608Metric_HomePlatePaste, model: cap, C: 1e-07, ESR: 0.0159, ESL: 5e-10, C_bias: '+0.2%@5V, -7.6%@12.5V, -27%@25V, -47%@37.5V, -62%@50V', from_schematic: [C, ESR, ESL, C_bias], note: value changed from '1u0'; check model}
  C7: {value: 1u0, footprint: C_0805_2012Metric, model: cap, C: 1e-06, ESR: 0.003, ESL: 6e-10, C_bias: 7.5e-07, from_schematic: [C, ESR, ESL, C_bias]}
  C8: {value: 1u0, footprint: C_0805_2012Metric, model: cap, C: 1e-06, ESR: 0.003, ESL: 6e-10, C_bias: 7.5e-07, from_schematic: [C, ESR, ESL, C_bias]}
  R3: {value: 499R0, footprint: R_0603_1608Metric, model: resistor, R: 499.0, from_schematic: [R]}
  R4: {value: 2k94, footprint: R_0603_1608Metric, model: resistor, R: 2940.0, from_schematic: [R]}
waivers: []
# What-if edits for `groundtruth compare` / `--what-if` (plain check/simulate ignore them), e.g.
#   - {type: via, at: [121.0, 122.6], net: GND, size: 0.6, drill: 0.3, enabled: true}
modifications: []
