# GroundTruth settings file: return-path / EMI analysis of rc_filter.kicad_pcb
# Edit by hand or from the KiCad plugin. `groundtruth init` refreshes the parts list and keeps your edits.
# Part models: short | open | resistor (R) | cap (C, ESR, ESL) | inductor (L, R) | ferrite (R, L)
# Net entries: driver/receivers are "REF.PAD"; freq in Hz (or "20MHz"); rise_time in s (or "2ns").
# Converters: switching power stages (hot loop, input capacitors, conducted emission); `groundtruth detect` suggests them.
# Bridges: motor drives (half-bridge legs on one bus, six-step), with the operating point and the motor; detected too.
version: 1
reference_nets: [GND]
analysis:
  grid_mm: auto
  margin_mm: 10.0
  solve_points: 4
  limit_class: B
  distance_m: auto
  ground_reflection: true
  planes: auto
  plane_capacitance: true
  cavity_max_nodes: 40000
  max_solves: 10
  driver_ohms: 25.0
  load_pf: 5.0
  threads: auto
  gpu: auto
  conducted: cispr32
  conducted_class: B
  via_plating_um: 25.0
rules:
  stitch_distance_mm: 2.0
  decap_distance_mm: 5.0
  edge_factor: 3.0
  min_gap_mm: 0.1
  detour_warning: 1.25
  detour_error: 2.0
  emi_margin_db: 6.0
  resonance_db: 10.0
  overshoot_warning: 0.25
  overshoot_error: 0.5
  current_density_warning: 50.0
  current_density_error: 100.0
  via_load_warning: 100.0
  via_load_error: 150.0
# Nets to analyse (manual list), e.g.
#   - {name: /SPI_SCK, driver: U1.12, receivers: [U3.5], freq: 20MHz, rise_time: 2ns, amplitude_v: 3.3}
nets:
  - {name: SIG_A, driver: U1.1, receivers: [U2.1], freq: 20MHz, rise_time: 1ns, amplitude_v: 3.3, through: [C1], class: example clock}
# Switching power stages (`groundtruth detect --write` suggests them), e.g.
#   - {name: buck 5V, topology: buck, rail: VIN, switch_node: SW, ground: GND, high_side: Q1,
#      low_side: Q2, f_sw: 400kHz, v_in: 24, v_out: 5, i_out: 3, rise_time: 5ns, c_oss: 1nF,
#      input_connector: [J1.1, J1.2], output_connector: [J2.1, J2.2]}
#   integrated converter IC: switch: U5 instead of high_side/low_side/switch_node
#   output_connector: the load's + and - pins (DC output path and ground return)
converters: []
# Motor bridges (`groundtruth detect --write` finds the legs; the operating point and the motor are yours), e.g.
#   - name: bridge J1
#     rail: VBUS
#     ground: GND
#     legs:
#       - {phase: A, switch_node: PH_A, high_side: [Q1], low_side: [Q2], output: J1.A}
#     input_connector: [J5.1, J5.2]
#     v_bus: 48
#     f_pwm: 20kHz
#     i_phase: 100
#     mode: motoring
#     speed_rpm: 3000
#     motor: {connection: star, r_ll: 20m, l_ll: 40uH, ke_ll: 5, pole_pairs: 7}
bridges: []
components:
  C1: {value: 100n, footprint: C_0402_1005Metric, model: cap, C: 1e-07, ESR: 0.02, ESL: 4e-10}
  C9: {value: 1n, footprint: C_0402_1005Metric, model: cap, C: 1e-09, ESR: 0.02, ESL: 4e-10}
  L1: {value: 1u, footprint: R_0402_1005Metric, model: inductor, L: 1e-06, R: 0.1}
  R1: {value: '33', footprint: R_0402_1005Metric, model: resistor, R: 33.0}
  U1: {value: IC, footprint: Fake_IC, model: open}
  U2: {value: IC, footprint: Fake_IC, model: open}
waivers: []
# What-if edits for `groundtruth compare` / `--what-if` (plain check/simulate ignore them), e.g.
#   - {type: via, at: [121.0, 122.6], net: GND, size: 0.6, drill: 0.3, enabled: true}
modifications: []
